name: Runner CI and container image

on:
  pull_request:
  push:
    branches:
      - main
      - feat/workspace-gc
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a validated branch image to GHCR'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
      - name: Go formatting
        run: |
          files=$(gofmt -l act/runner/run_context.go internal/app/poll internal/pkg/config internal/pkg/workspacegc)
          if [ -n "$files" ]; then
            echo "$files"
            gofmt -d act/runner/run_context.go internal/app/poll internal/pkg/config internal/pkg/workspacegc
            exit 1
          fi
      - name: Unit and race tests
        run: go test -short -race ./...

  image:
    name: Build OCI image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@v4
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pando85/runner
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=workspace-gc,enable=${{ github.ref == 'refs/heads/feat/workspace-gc' }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
      - name: Authenticate to GHCR
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
